version: 2

macros:
  - name: initcap
    description: Title-case each whitespace-separated word.
    arguments:
      - name: field_name
        type: string
        description: Column to title-case

  - name: jev_score_to_label
    description: >
      Map a Jev rubric score (weighted 0-3 position) to its criterion label:
      round to the nearest criterion index and offset by 1 (DuckDB lists are
      1-indexed). round() is half-away-from-zero, so exact .5 ties select the
      higher criterion. Boundary behavior is asserted by the singular test
      tests/jev_score_to_label_boundaries.sql.
    arguments:
      - name: criteria
        type: list
        description: Ordered list of criterion labels (index 0 = score 0)
      - name: score
        type: string
        description: SQL expression returning the weighted 0-3 score

  - name: drop_schema
    description: Drop a schema in the selected database.
    arguments:
      - name: schema_name
        type: string
        description: Schema to drop
      - name: database_name
        type: string
        description: Database containing the schema (defaults to target.database)

  - name: generate_schema_name
    description: >
      Prod uses custom schemas as-is. Other environments ignore custom schemas
      except 6_access models, which keep their configured schema.

  - name: generate_database_name
    description: Use a custom database when configured, otherwise the target database.
