version: 2

models:
  - name: stg_violence_gore_summary
    description: >
      Staging model for the violence/gore summary produced by the Mistral
      web-search pipeline. The summary text is label-free for all future
      rows (the current prompt strips labels); historical rows may contain
      embedded severity/frequency labels (legacy prompt). Classification
      (severity/frequency, 0-3 score scale with calibrated confidence) is
      provided by int_violence_classification (Jev prompt_jev), not by text
      extraction. Append-only; latest row per film is selected by consumers
      via row_number() over (partition by tmdb_id order by scraped_at desc).
      Citations are not included here; they live in the
      violence_gore_summary__citations source child table.
    columns:
      - name: tmdb_id
        data_type: integer
        description: "TMDB movie ID (join key to movie_catalogue)"
        data_tests:
          - not_null
      - name: title
        data_type: varchar
        description: "Movie title analysed"
      - name: release_date
        data_type: varchar
        description: "Release date used to disambiguate the movie (YYYY-MM-DD)"
      - name: summary
        data_type: varchar
        description: >
          "Concise, label-free violence/gore summary text. Historical rows
          may end with one severity label (Mild, Moderate, High, Extreme) and
          one frequency label (Isolated, Occasional, Frequent, Pervasive)
          from the legacy prompt; the current prompt strips these labels.
          Classification comes from int_violence_classification, not text
          extraction."
      - name: model
        data_type: varchar
        description: "Mistral model used for the analysis"
      - name: scraped_at
        data_type: timestamp
        description: "UTC timestamp of the pipeline run (snapshot key)"
        data_tests:
          - not_null
      - name: _dlt_load_id
        data_type: varchar
        description: "DLT load identifier"
      - name: _dlt_id
        data_type: varchar
        description: "DLT unique identifier"
