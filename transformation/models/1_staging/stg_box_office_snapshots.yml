version: 2

models:
  - name: stg_box_office_snapshots
    description: >
      Staging model for OMDb box-office snapshot rows. One row per film per
      pipeline run; append-only time series. Deduplication to the latest
      snapshot per film happens in int_box_office_latest.
    columns:
      - name: scraped_at
        data_type: timestamp
        description: "UTC timestamp of the pipeline run"
        data_tests:
          - not_null
      - name: tmdb_id
        data_type: integer
        description: "TMDB movie ID"
        data_tests:
          - not_null
      - name: imdb_id
        data_type: varchar
        description: "IMDb title ID"
        data_tests:
          - not_null
      - name: imdb_rating
        data_type: varchar
        description: "IMDb rating (0-10) or 'N/A'"
      - name: imdb_votes
        data_type: varchar
        description: "IMDb votes count or 'N/A'"
      - name: metascore
        data_type: varchar
        description: "Metacritic score (0-100) or 'N/A'"
      - name: rotten_tomatoes_score
        data_type: varchar
        description: "Rotten Tomatoes tomatometer (e.g. '72%') or 'N/A'"
      - name: metacritic_score
        data_type: varchar
        description: "Metacritic score from the Ratings array or 'N/A'"
      - name: box_office
        data_type: varchar
        description: >
          "US box office gross (e.g. '$47,000,000') or 'N/A'. Later snapshots
          may regress a previously reported value to 'N/A'; the latest
          snapshot is authoritative."
      - name: _dlt_load_id
        data_type: varchar
        description: "DLT load identifier"
      - name: _dlt_id
        data_type: varchar
        description: "DLT unique identifier"
