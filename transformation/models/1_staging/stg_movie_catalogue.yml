version: 2

models:
  - name: stg_movie_catalogue
    description: "Staging model for movie catalogue data from TMDB"
    columns:
      - name: adult
        data_type: boolean
        description: "Whether the movie is adult content"
      - name: backdrop_path
        data_type: varchar
        description: "Path to backdrop image"
      - name: id
        data_type: integer
        description: "TMDB movie ID"
        data_tests:
          - not_null
          - unique
      - name: original_language
        data_type: varchar
        description: "Original language code"
      - name: original_title
        data_type: varchar
        description: "Original movie title"
      - name: overview
        data_type: varchar
        description: "Movie overview/synopsis"
      - name: poster_path
        data_type: varchar
        description: "Path to poster image"
      - name: release_date
        data_type: varchar
        description: "Release date in YYYY-MM-DD format"
      - name: title
        data_type: varchar
        description: "Movie title"
      - name: video
        data_type: boolean
        description: "Whether the movie has video content"
      - name: _dlt_load_id
        data_type: varchar
        description: "DLT load identifier"
      - name: _dlt_id
        data_type: varchar
        description: "DLT unique identifier"
