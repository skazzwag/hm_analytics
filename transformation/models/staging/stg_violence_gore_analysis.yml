name: stg_violence_gore_analysis
description: "Staging model for violence and gore analysis from Claude API"
columns:
  - name: title
    data_type: varchar
    description: "Movie title"
  - name: release_date
    data_type: varchar
    description: "Release date in YYYY-MM-DD format"
  - name: model
    data_type: varchar
    description: "AI model used for analysis"
  - name: model_response
    data_type: varchar
    description: "Raw response text from the AI model"
  - name: timestamp
    data_type: timestamp
    description: "When the analysis was performed"
  - name: _dlt_load_id
    data_type: varchar
    description: "DLT load identifier"
  - name: _dlt_id
    data_type: varchar
    description: "DLT unique identifier"
