[project]
name = "hm-analytics"
version = "0.1.0"
description = "Horror movie analytics: studying the effect of violence/gore on movie reception"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.10.1",
    "dlt[duckdb,workspace]>=1.23.0",
    "marimo>=0.13.0",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "python-dotenv>=1.0.0",
    "pyzmq>=27.1.0",
    "requests>=2.32.5",
]

[project.scripts]
run-ingestion = "ingestion.run_pipeline:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["ingestion*"]

[dependency-groups]
dev = [
    # Uncomment when transformation/ is developed:
    # "dbt-core>=1.8",
    # "dbt-duckdb>=1.8",
]
